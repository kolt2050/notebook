<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portable Notebook</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="lib/turndown.js"></script>
    <script src="lib/marked.min.js"></script>
    <!-- Highlight.js -->
    <link rel="stylesheet" href="lib/github-dark.min.css">
    <script src="lib/highlight.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600&display=swap"
        rel="stylesheet">
    <script src="js/i18n.js"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="app-logo-wrapper">
                    <img src="img/logo-dark.png" alt="Notebook Logo" class="app-logo">
                </div>
                <h2 data-i18n="app_title">Notebook</h2>
                <div class="sidebar-actions">
                    <button id="home-btn" class="btn" title="Home"
                        style="padding: 2px 6px; font-size: 1.1em; margin-right: 5px;">🏠</button>
                    <button id="lang-toggle-btn" class="btn"
                        style="padding: 2px 6px; font-size: 0.8em; margin-right: 5px;">EN</button>
                    <button id="add-doc-btn" data-i18n="add_doc" data-i18n-attr="title"
                        title="Add Document">📄+</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" data-i18n-placeholder="search_placeholder" placeholder="Поиск...">
                <span id="search-clear" class="search-clear">&times;</span>
            </div>
            <div id="tree-container" class="tree-container">
                <!-- Tree will be rendered here -->
            </div>
            <div class="sidebar-footer">
                <div class="sidebar-footer-actions" style="margin-bottom: 15px;">
                    <button id="export-all-btn" class="btn secondary" data-i18n="export_all"
                        style="width: 100%; padding: 6px;">Export All</button>
                    <button id="backup-db-btn" class="btn backup" data-i18n="backup_db"
                        style="width: 100%; padding: 6px; margin-top: 8px;">Backup JSON</button>
                    <button id="import-db-btn" class="btn import" data-i18n="import_db"
                        style="width: 100%; padding: 6px; margin-top: 8px;">Import JSON</button>
                </div>
                <div class="stats" style="margin-bottom: 10px; font-size: 0.9em; opacity: 0.7;">
                    <span data-i18n="total_docs">Total documents: </span><span id="doc-count">0</span>
                </div>
                <button id="reset-btn" class="btn danger" data-i18n="reset_notebook" style="width: 100%;">Reset
                    Notebook</button>
            </div>
        </aside>
        <div id="resizer" class="resizer"></div>
        <main class="main-content">
            <div id="welcome-view" class="welcome-dashboard" style="position: relative;">
                <div class="welcome-top-left"
                    style="position: absolute; top: 20px; left: 60px; display: flex; gap: 10px;">
                    <button id="welcome-export-shortcuts-btn" class="btn backup">📤 Export start page</button>
                    <button id="welcome-import-shortcuts-btn" class="btn import">📥 Import start page</button>
                </div>

                <div class="dashboard-grid"
                    style="grid-template-columns: 1fr; max-width: 100%; width: 100%; flex: 1; margin-bottom: 20px;">
                    <div class="dashboard-section" style="display: flex; flex-direction: column; height: 100%;">
                        <h2 data-i18n="shortcuts_title">Shortcuts</h2>
                        <div id="shortcuts-container" class="shortcut-cards"
                            style="flex: 1; align-content: flex-start; overflow-y: auto; padding: 10px; margin: -10px;">
                            <!-- Shortcuts rendered here -->
                        </div>
                    </div>
                </div>
            </div>

            <div id="editor-view" style="display: none; width: 100%; height: 100%; flex-direction: column;">
                <header class="editor-header">
                    <input type="text" id="doc-title" data-i18n-placeholder="doc_title_placeholder"
                        placeholder="Document Title..." class="title-input">
                    <div class="editor-toolbar">
                        <button id="export-doc-btn" class="toolbar-btn" data-i18n="export_md">Export to
                            Markdown</button>
                        <button id="delete-btn" class="toolbar-btn danger" data-i18n="delete_btn">Delete</button>
                    </div>
                </header>
                <div id="editor" class="editor-content" contenteditable="true" spellcheck="false">
                    <!-- Content will be here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-container" class="modal-container hidden">
        <div class="modal">
            <h3 id="modal-title">Modal Title</h3>
            <div id="modal-body" class="modal-body"></div>
            <div class="modal-footer">
                <button id="modal-cancel" class="btn" data-i18n="modal_cancel">Cancel</button>
                <button id="modal-confirm" class="btn primary" data-i18n="modal_confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/tree.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
